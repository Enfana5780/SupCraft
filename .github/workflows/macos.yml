name: SupCraft macOS

on:
  push:
    branches: [main]
    paths: ['macos/**', 'assets/**', 'legal/**', 'VERSION', 'LICENSE', 'LICENSING.md', 'THIRD-PARTY-NOTICES.md', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'assets/**', 'legal/**', 'VERSION', 'LICENSE', 'LICENSING.md', 'THIRD-PARTY-NOTICES.md', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            macos
            assets
            .github
            legal
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: macos/requirements-macos.txt
      - name: Core regression checks
        run: |
          dotnet run --project macos/SupCraft.Checks -c Release
          python macos/test_runtime.py
          python legal/check_materials.py
      - name: Install native build libraries
        run: brew install libass libpng libimagequant pkg-config meson ninja
      - name: Build, launch and conversion-test native app
        run: python macos/build_macos.py
      - name: Capture native interface
        run: |
          macos/dist/stage-arm64/SupCraft.app/Contents/MacOS/SupCraft --self-test-ui --screenshot macos/dist/SupCraft-arm64.png
          macos/dist/stage-arm64/SupCraft.app/Contents/MacOS/SupCraft --self-test-ui --compact --preview-ass macos/vendor/native-fixture/fixture.ass --screenshot macos/dist/SupCraft-arm64-compact.png
      - uses: actions/upload-artifact@v4
        with:
          name: SupCraft-macOS-arm64
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg
            macos/dist/*.txt
            macos/dist/*.png
          if-no-files-found: error
          retention-days: 30
